name: driver-build

# Builds xhci.device in the stack's toolchain container for three cache-op
# selections and checks that XHCI_COALESCE_CACHE_OPS changes only the build
# it is meant to: with the macro at 0, and in the rangeops build, the binary
# must be byte-identical to the base branch's.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/rondoval/amiga-build-container:gcc-v16.2
    env:
      STACK_REV: 0fef34d7c7f4723238df94e31e6bfaa171219352
      COMMON_REV: 819ed0a1d88fd80501ae789967c2c42464a6fc83
      BASE_REV: 4aa7e4c4430f259e2d1675dd249c069a47177e91
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lvo-coalesce, lvo: "ON", extra: "", same_as_base: "no" }
          - { name: lvo-macro0, lvo: "ON", extra: "-DXHCI_COALESCE_CACHE_OPS=0", same_as_base: "yes" }
          - { name: rangeops, lvo: "OFF", extra: "", same_as_base: "yes" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: xhci
          fetch-depth: 0
      - name: Stack and base tree
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git clone -q --depth 1 https://github.com/rondoval/emu68-driver-stack.git stack
          git -C stack fetch -q --depth 1 origin "$STACK_REV"
          git -C stack checkout -q --detach FETCH_HEAD
          git -C stack submodule update -q --init --depth 1
          # high-speed-isoch needs Emu68Common 2.1 (DT_OpenSymbol): the dev branch
          git -C stack/components/emu68-common fetch -q --depth 1 origin "$COMMON_REV"
          git -C stack/components/emu68-common checkout -q FETCH_HEAD
          git -C xhci worktree add -q ../base "$BASE_REV"
          {
            echo "head=$(git -C xhci rev-parse HEAD)"
            echo "base=$(git -C base rev-parse HEAD)"
            echo "stack=$(git -C stack rev-parse HEAD)"
            echo "common=$(git -C stack/components/emu68-common rev-parse HEAD)"
            git -C stack submodule status --recursive
            cmake --version
          } > build-provenance.log
      - name: Build head and base
        shell: bash
        run: |
          set -euo pipefail
          checked_build() { # logfile command args...
            local log="$1"
            shift
            if "$@" 2>&1 | tee "$log"; then
              :
            else
              echo "Build command failed; see $log" >&2
              return 1
            fi
            local diagnostics status=0
            diagnostics=$(grep -E "warning:|error:" "$log") || status=$?
            [ "$status" -le 1 ] || return 1
            if [ "$status" -eq 0 ]; then
              # Unresolved upstream emu68-common diagnostic at COMMON_REV.
              # Keep it visible, accept one exact occurrence in this
              # dependency build only, and reject any additional diagnostic.
              # Compiler flags and Werror are unchanged.
              local known="$PWD/stack/components/emu68-common/include/emu68_features.h:49:14: warning: declaration of 'DeviceTreeBase' shadows a global declaration [-Wshadow]"
              if { [ "$log" = build-head.log ] || [ "$log" = build-base.log ]; } &&
                 [ "$diagnostics" = "$known" ]; then
                echo "KNOWN UNRESOLVED DEPENDENCY WARNING: $diagnostics"
                return 0
              fi
              printf '%s\n' "$diagnostics"
              echo "Build diagnostics rejected; see $log" >&2
              return 1
            fi
          }
          build() { # src tag lvo extra
            local i="$PWD/i-$2"
            cmake -S stack -B "b-$2" -DEMU68_DEBUG_BACKEND=off -DEMU68_FORCE_LVO_CACHE_OPS="$3" \
              -DEMU68_XHCI_CONTEXT_SOURCE_DIR="$PWD/$1" -DCMAKE_INSTALL_PREFIX="$i" \
              "-DTOOLCHAIN_CFLAGS=-I$i/Developer/include $4" > "cfg-$2.log"
            checked_build "devicetree-$2.log" cmake --build "b-$2" --target devicetree.resource
            checked_build "build-$2.log" cmake --build "b-$2" --target emu68-xhci-driver-context
            cp "$i/DEVS/USBHardware/xhci.device" "xhci-$2.device"
            sha256sum "xhci-$2.device"
          }
          build xhci head "${{ matrix.lvo }}" "${{ matrix.extra }}"
          build base base "${{ matrix.lvo }}" ""
      - name: Compare with base
        shell: bash
        run: |
          set -euo pipefail
          clear_e=$(od -An -tx1 -v xhci-head.device | tr -d ' \n' | { grep -o 4eaefd7e || true; } | wc -l)
          echo "head CacheClearE call sites: $clear_e"
          if [ "${{ matrix.same_as_base }}" = yes ]; then
            cmp xhci-head.device xhci-base.device
          else
            ! cmp -s xhci-head.device xhci-base.device
            [ "$clear_e" -gt 0 ]
          fi
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-build-${{ matrix.name }}
          path: |
            build-provenance.log
            cfg-*.log
            devicetree-*.log
            build-*.log
            xhci-*.device
